name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Intentional required-check failure - do not merge
        run: exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.2'
          cache: false
      - name: Read-only formatting and whitespace
        run: make fmt-check
      - name: Complete normal and live-tag lint
        run: make lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.0'
          cache: false
      - name: Tests and race detector
        run: go test -race ./...
      - name: Static checks
        run: go vet ./...
      - name: Build without cgo, including examples
        run: CGO_ENABLED=0 go build ./...
      - name: Compile live suite without running tests
        run: go test -tags=typesafe_live -run '^$' ./...
