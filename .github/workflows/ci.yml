name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.2'
          cache: false
      - name: Read-only formatting and whitespace
        run: make fmt-check
      - name: Complete normal and live-tag lint
        run: make lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.0'
          cache: false
      - name: Tests and race detector
        run: go test -race ./...
      - name: Static checks
        run: go vet ./...
      - name: Build without cgo, including examples
        run: CGO_ENABLED=0 go build ./...
      - name: Compile live suite without running tests
        run: go test -tags=typesafe_live -run '^$' ./...
